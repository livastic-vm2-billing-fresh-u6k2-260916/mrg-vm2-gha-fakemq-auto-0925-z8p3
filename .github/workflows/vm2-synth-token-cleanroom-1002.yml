name: VM2 Synthetic Token Cleanroom 1002

on:
  pull_request:
    branches:
      - vm2-synth-token-target-1002b
    paths:
      - 'vm2-synth-token-probe/**'

permissions:
  contents: write

jobs:
  token-probe:
    name: vm2-synth-token-probe
    runs-on: ubuntu-latest
    steps:
      - name: Probe target ref write
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          tag="vm2-synth-clean-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          body=$(printf '{"ref":"refs/tags/%s","sha":"%s"}' "$tag" "$BASE_SHA")
          code=$(curl -sS -o /tmp/vm2-tag-response -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPOSITORY/git/refs" -d "$body")
          echo "VM2_PR_HEAD_REPO=$PR_HEAD_REPO"
          echo "VM2_PR_HEAD_SHA=$PR_HEAD_SHA"
          echo "VM2_BASE_SHA=$BASE_SHA"
          echo "VM2_TOKEN_PROBE_HTTP=$code"
          if [ "$code" = "201" ]; then echo 'VM2_TOKEN_WRITE=1'; else echo 'VM2_TOKEN_WRITE=0'; fi
          exit 0
